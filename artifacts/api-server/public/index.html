<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#25D366',
            'primary-dark': '#128C7E',
            'primary-light': '#dcfce7',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; }
    .input-field { @apply w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white text-gray-800 placeholder-gray-400 transition; }
    .btn-primary { @apply w-full py-3 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold transition-all duration-200 active:scale-95; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-primary rounded-full mb-4 shadow-lg">
        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l4.93-1.37A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.66 0-3.22-.46-4.56-1.26l-.32-.19-3.34.93.93-3.34-.19-.32A7.96 7.96 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.59-10.59c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1-.37-1.91-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.39-.4-.54-.4-.14 0-.3-.02-.46-.02-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.59 4.12 3.63.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">ChatApp</h1>
      <p class="text-gray-500 text-sm mt-1">Connect with friends, chat instantly</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Tabs -->
      <div class="flex rounded-xl bg-gray-100 p-1 mb-6">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-white text-primary shadow-sm">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchTab('signup')"
          class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-500 hover:text-gray-700">
          Create Account
        </button>
      </div>

      <!-- Alert -->
      <div id="alert" class="hidden mb-4 px-4 py-3 rounded-lg text-sm font-medium"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="you@example.com" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Password</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required />
        </div>
        <button type="submit" id="login-btn" class="btn-primary mt-2">Sign In</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Full Name</label>
          <input type="text" id="signup-name" class="input-field" placeholder="John Doe" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email</label>
          <input type="email" id="signup-email" class="input-field" placeholder="you@example.com" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Password</label>
          <input type="password" id="signup-password" class="input-field" placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <button type="submit" id="signup-btn" class="btn-primary mt-2">Create Account</button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">© 2024 ChatApp. Real-time messaging.</p>
  </div>

  <script>
    const API = '';

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('login-form').classList.toggle('hidden', !isLogin);
      document.getElementById('signup-form').classList.toggle('hidden', isLogin);
      const activeClass = 'bg-white text-primary shadow-sm';
      const inactiveClass = 'text-gray-500 hover:text-gray-700';
      document.getElementById('tab-login').className = `flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 ${isLogin ? activeClass : inactiveClass}`;
      document.getElementById('tab-signup').className = `flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 ${!isLogin ? activeClass : inactiveClass}`;
      hideAlert();
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `mb-4 px-4 py-3 rounded-lg text-sm font-medium ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
    }

    function hideAlert() {
      document.getElementById('alert').className = 'hidden mb-4 px-4 py-3 rounded-lg text-sm font-medium';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait...' : (btnId === 'login-btn' ? 'Sign In' : 'Create Account');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      setLoading('login-btn', true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showAlert(data.error || 'Login failed'); return; }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/app.html';
      } catch {
        showAlert('Connection error. Please try again.');
      } finally {
        setLoading('login-btn', false);
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideAlert();
      setLoading('signup-btn', true);
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('signup-name').value,
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showAlert(data.error || 'Signup failed'); return; }
        showAlert('Account created! Signing you in...', false);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        setTimeout(() => { window.location.href = '/app.html'; }, 800);
      } catch {
        showAlert('Connection error. Please try again.');
      } finally {
        setLoading('signup-btn', false);
      }
    }

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/app.html';
    }
  </script>
</body>
</html>
