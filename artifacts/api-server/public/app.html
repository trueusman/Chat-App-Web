<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#25D366',
            'primary-dark': '#128C7E',
            'primary-light': '#d9fdd3',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .msg-bubble-sent { background: #d9fdd3; }
    .msg-bubble-recv { background: #ffffff; }
    .scroll-smooth { scroll-behavior: smooth; }
    #messages-area::-webkit-scrollbar { width: 5px; }
    #messages-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    #sidebar-list::-webkit-scrollbar { width: 4px; }
    #sidebar-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    .chat-item:hover { background: #f5f5f5; }
    .chat-item.active { background: #f0fdf4; }
    .online-dot { background: #25D366; }
    .offline-dot { background: #9ca3af; }
    .emoji-picker { display: none; position: absolute; bottom: 60px; left: 0; background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 100; width: 280px; }
    .emoji-picker.open { display: block; }
    .emoji-btn { font-size: 20px; cursor: pointer; padding: 4px; border-radius: 6px; transition: background 0.1s; }
    .emoji-btn:hover { background: #f3f4f6; }
    @media (max-width: 768px) {
      #sidebar { width: 100%; }
      #main-area { display: none; }
      #main-area.mobile-open { display: flex; position: fixed; inset: 0; z-index: 50; }
      #sidebar.mobile-hidden { display: none; }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-100">

  <!-- App Shell -->
  <div class="flex flex-1 overflow-hidden h-full">

    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar" class="w-full md:w-80 lg:w-96 flex flex-col bg-white border-r border-gray-200 h-full flex-shrink-0">

      <!-- Sidebar Header -->
      <div class="bg-primary-dark px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="setTab('profile')">
          <div class="relative">
            <img id="header-avatar" src="" alt="" class="w-10 h-10 rounded-full object-cover border-2 border-white/30 bg-gray-300" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect width=%2240%22 height=%2240%22 fill=%22%23128C7E%22/><text x=%2220%22 y=%2227%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22>?</text></svg>'" />
            <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-primary-dark online-dot"></span>
          </div>
          <div>
            <p id="header-name" class="text-white font-semibold text-sm leading-tight"></p>
            <p id="header-status" class="text-white/70 text-xs truncate max-w-[150px]"></p>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="setTab('people')" title="Find People" class="text-white/80 hover:text-white p-2 rounded-full hover:bg-white/10 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
          <button onclick="logout()" title="Logout" class="text-white/80 hover:text-white p-2 rounded-full hover:bg-white/10 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="px-3 py-2 bg-gray-50 border-b border-gray-100">
        <div class="relative">
          <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search..." class="w-full pl-9 pr-4 py-2 rounded-lg bg-white border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary text-gray-700" oninput="handleSearch(this.value)" />
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-gray-200 bg-white">
        <button id="tab-chats" onclick="setTab('chats')" class="flex-1 py-3 text-xs font-bold uppercase tracking-wide transition border-b-2 border-primary text-primary">Chats</button>
        <button id="tab-people" onclick="setTab('people')" class="flex-1 py-3 text-xs font-bold uppercase tracking-wide transition border-b-2 border-transparent text-gray-400 hover:text-gray-600">People</button>
        <button id="tab-requests" onclick="setTab('requests')" class="flex-1 py-3 text-xs font-bold uppercase tracking-wide transition border-b-2 border-transparent text-gray-400 hover:text-gray-600 relative">
          Requests
          <span id="requests-badge" class="hidden absolute top-2 right-1 bg-red-500 text-white text-xs rounded-full min-w-[16px] h-4 flex items-center justify-center px-1 leading-none"></span>
        </button>
        <button id="tab-profile" onclick="setTab('profile')" class="flex-1 py-3 text-xs font-bold uppercase tracking-wide transition border-b-2 border-transparent text-gray-400 hover:text-gray-600">Profile</button>
      </div>

      <!-- Sidebar List -->
      <div id="sidebar-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- ===== MAIN AREA ===== -->
    <div id="main-area" class="hidden md:flex flex-1 flex-col h-full overflow-hidden">

      <!-- Welcome Screen -->
      <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center bg-gray-50 text-center px-8">
        <div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mb-5">
          <svg class="w-12 h-12 text-primary" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l4.93-1.37A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-700 mb-2">ChatApp</h2>
        <p class="text-gray-400 text-sm max-w-xs">Send and receive messages instantly. Add friends and start chatting.</p>
      </div>

      <!-- Chat Window -->
      <div id="chat-window" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- Chat Header -->
        <div class="bg-primary-dark px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button id="chat-back-btn" onclick="closeMobileChat()" class="md:hidden text-white mr-1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="relative">
              <img id="chat-avatar" src="" alt="" class="w-10 h-10 rounded-full object-cover border-2 border-white/30 bg-gray-300" onerror="this.src=defaultAvatar()" />
              <span id="chat-online-dot" class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-primary-dark"></span>
            </div>
            <div>
              <p id="chat-name" class="text-white font-semibold text-sm leading-tight"></p>
              <p id="chat-status-text" class="text-white/70 text-xs"></p>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="toggleMsgSearch()" title="Search messages" class="text-white/80 hover:text-white p-2 rounded-full hover:bg-white/10 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </button>
          </div>
        </div>

        <!-- Msg Search Bar -->
        <div id="msg-search-bar" class="hidden bg-white px-4 py-2 border-b border-gray-200 flex items-center gap-2">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="msg-search-input" type="text" placeholder="Search in conversation..." class="flex-1 text-sm focus:outline-none text-gray-700" oninput="searchMessages(this.value)" />
          <button onclick="closeMsgSearch()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Messages Area -->
        <div id="messages-area" class="flex-1 overflow-y-auto px-4 py-4 space-y-1" style="background: #efeae2 url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 opacity=%220.04%22><text y=%2220%22 font-size=%2220%22>💬</text></svg>');">
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="hidden px-4 py-1 bg-white border-t border-gray-100">
          <span class="text-xs text-gray-400 italic" id="typing-text"></span>
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t border-gray-200 px-3 py-3 flex items-end gap-2 relative">
          <!-- Emoji Picker -->
          <div id="emoji-picker" class="emoji-picker">
            <div class="grid grid-cols-8 gap-1">
            </div>
          </div>
          <button onclick="toggleEmoji()" class="text-gray-400 hover:text-primary p-1.5 rounded-full hover:bg-gray-100 transition flex-shrink-0" title="Emoji">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </button>
          <textarea id="msg-input" rows="1" placeholder="Type a message"
            class="flex-1 resize-none rounded-2xl border border-gray-200 px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-primary text-gray-800 bg-white max-h-32 overflow-y-auto"
            oninput="handleTyping(); autoResize(this)"
            onkeydown="handleMsgKeydown(event)"></textarea>
          <button onclick="sendMessage()" class="bg-primary hover:bg-primary-dark text-white p-2.5 rounded-full transition-all active:scale-95 flex-shrink-0">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Profile View (in main area) -->
      <div id="profile-view" class="hidden flex-1 overflow-y-auto bg-gray-50">
        <div class="max-w-xl mx-auto py-8 px-6">
          <h2 class="text-xl font-bold text-gray-800 mb-6">Profile</h2>

          <!-- Avatar Section -->
          <div class="bg-white rounded-2xl shadow-sm p-6 mb-4 text-center">
            <div class="relative inline-block mb-4">
              <img id="profile-avatar" src="" alt="" class="w-24 h-24 rounded-full object-cover border-4 border-primary-light bg-gray-200" onerror="this.src=defaultAvatar()" />
            </div>
            <div class="mb-3">
              <label class="block text-xs text-gray-500 mb-1">Profile Picture URL</label>
              <input id="profile-image-url" type="url" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
          </div>

          <!-- Info Section -->
          <div class="bg-white rounded-2xl shadow-sm p-6 mb-4 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Full Name</label>
              <input id="profile-name" type="text" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email</label>
              <input id="profile-email" type="email" disabled class="w-full px-4 py-2.5 rounded-lg border border-gray-100 bg-gray-50 text-sm text-gray-400 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Bio</label>
              <textarea id="profile-bio" rows="2" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary resize-none" placeholder="Tell people about yourself..."></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Status Message</label>
              <input id="profile-status" type="text" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Joined</label>
              <p id="profile-joined" class="text-sm text-gray-500"></p>
            </div>
            <button onclick="saveProfile()" class="w-full py-2.5 bg-primary hover:bg-primary-dark text-white font-semibold rounded-lg transition text-sm">Save Profile</button>
          </div>

          <!-- Change Password -->
          <div class="bg-white rounded-2xl shadow-sm p-6 space-y-4">
            <h3 class="font-semibold text-gray-700">Change Password</h3>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Current Password</label>
              <input id="current-password" type="password" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">New Password</label>
              <input id="new-password" type="password" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <button onclick="changePassword()" class="w-full py-2.5 bg-gray-700 hover:bg-gray-800 text-white font-semibold rounded-lg transition text-sm">Update Password</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
